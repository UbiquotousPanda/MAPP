# Layered on the root compose.yaml on the hosted test VM; see README.md here and ADR-0021.
services:
  api:
    environment:
      PUBLIC_HOSTS: ${MAPP_HOST:?set MAPP_HOST in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  web:
    restart: unless-stopped

  # The only service reachable from outside: HTTPS with a certificate from Let's Encrypt.
  caddy:
    image: docker.io/library/caddy:2.10-alpine
    environment:
      MAPP_HOST: ${MAPP_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/test-vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
