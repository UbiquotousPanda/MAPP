<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100" font-family="Jost, Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SP&amp;A One (MAPP) Azure deployment architecture</title>
  <desc id="desc">Shell staff sign in through Microsoft Entra ID and reach one public hostname on Azure Front Door Premium with WAF. Front Door routes /api/* to internal API Management and everything else to the web container. API Management calls the Go API running on Azure Container Apps, beside a migrate job and a later GSAP worker. The API reads Azure Database for PostgreSQL 18 Flexible Server through a private endpoint. Key Vault, Azure Container Registry and Log Analytics with Dynatrace support all of it, one resource group per environment.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      .h { font-size: 17px; font-weight: 600; fill: #292929; }
      .s { font-size: 12.5px; fill: #5b6b7a; font-family: Arial, Helvetica, sans-serif; }
      .tag { font-size: 11px; font-weight: 600; fill: #ffffff; letter-spacing: .4px; font-family: Arial, Helvetica, sans-serif; }
      .lbl { font-size: 12px; fill: #5b6b7a; font-family: Arial, Helvetica, sans-serif; }
      .lbl b { font-weight: 700; }
      .zone { font-size: 13px; font-weight: 600; fill: #336094; letter-spacing: .3px; }
      .dim { fill: #8a8a8a; }
      .flow { stroke: #5b6b7a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flowDim { stroke: #8a8a8a; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrowDim); }
    </style>
  </defs>

  <rect width="1440" height="1100" fill="#ffffff"/>

  <text x="60" y="46" class="h" font-size="26">SP&amp;A One (MAPP) — Azure deployment architecture</text>
  <text x="60" y="72" class="s" font-size="14">Planned, not built (ADR-0021). One public hostname, routed by path: /api/* to API Management, everything else to the web container.</text>

  <!-- People and identity -->
  <rect x="60" y="106" width="360" height="72" rx="10" fill="#f6edf5" stroke="#87217d" stroke-width="1.5"/>
  <text x="80" y="136" class="h">Shell staff · about 2,000</text>
  <text x="80" y="160" class="s">Browser · https://spa-one.shell.com</text>

  <rect x="520" y="106" width="380" height="72" rx="10" fill="#eef3fa" stroke="#003c88" stroke-width="1.5"/>
  <text x="540" y="136" class="h">Microsoft Entra ID + SAM</text>
  <text x="540" y="160" class="s">Auth code + PKCE · MFA · roles owned by SAM</text>

  <path d="M 424 142 L 512 142" stroke="#5b6b7a" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <text x="468" y="132" class="lbl" text-anchor="middle">sign in</text>

  <!-- Entra to APIM, around the right -->
  <path d="M 900 160 H 1330 V 388 H 1252" class="flowDim"/>
  <text x="1352" y="250" class="lbl" transform="rotate(90 1352 250)" text-anchor="middle">ID token, validated by APIM</text>

  <path d="M 240 182 V 206" class="flow"/>

  <!-- Front Door -->
  <rect x="60" y="210" width="1180" height="88" rx="10" fill="#eef3fa" stroke="#003c88" stroke-width="2"/>
  <rect x="60" y="210" width="1180" height="26" rx="10" fill="#003c88"/>
  <rect x="60" y="226" width="1180" height="10" fill="#003c88"/>
  <text x="80" y="228" class="tag">THE ONLY PUBLIC ENTRY</text>
  <text x="80" y="262" class="h">Azure Front Door Premium + WAF</text>
  <text x="80" y="285" class="s">TLS at the edge · OWASP managed rules and bot protection · caches /assets/* (immutable) · never caches index.html or /api/*</text>

  <path d="M 340 302 V 332" class="flow"/>
  <text x="352" y="322" class="lbl"><tspan font-weight="700">/*</tspan></text>
  <path d="M 960 302 V 332" class="flow"/>
  <text x="972" y="322" class="lbl"><tspan font-weight="700">/api/*</tspan></text>

  <!-- Web container and APIM -->
  <rect x="60" y="336" width="560" height="104" rx="10" fill="#e6f4f6" stroke="#008192" stroke-width="1.5"/>
  <text x="80" y="366" class="h">Container App: web</text>
  <text x="80" y="390" class="s">nginx (unprivileged) serving the built React files</text>
  <text x="80" y="412" class="s">Content security policy of ADR-0018 · 1–3 replicas</text>

  <rect x="680" y="336" width="560" height="104" rx="10" fill="#eef3fa" stroke="#003c88" stroke-width="1.5"/>
  <text x="700" y="366" class="h">API Management — internal mode</text>
  <text x="700" y="390" class="s">Validates the JWT · rate limits · body size ≥ 7 MB</text>
  <text x="700" y="412" class="s">Publishes backend/api/openapi.yaml, the contract</text>

  <path d="M 960 444 V 524" class="flow"/>
  <text x="972" y="470" class="lbl">Private Link</text>

  <!-- Container Apps environment -->
  <rect x="60" y="482" width="1180" height="246" rx="12" fill="#f7f9fc" stroke="#b9c6d6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="80" y="508" class="zone">AZURE CONTAINER APPS ENVIRONMENT — internal ingress, Shell landing-zone spoke VNet</text>

  <rect x="90" y="528" width="280" height="172" rx="10" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="110" y="558" class="h dim">Job: gsap worker</text>
  <text x="110" y="582" class="s dim">Later, not this phase</text>
  <text x="110" y="604" class="s dim">Daily: writes FSSI 1523,</text>
  <text x="110" y="624" class="s dim">reads PGSI 941, idempotent</text>
  <text x="110" y="652" class="s dim">Today the simulated GSAP</text>
  <text x="110" y="672" class="s dim">runs inside the API (ADR-0016)</text>

  <rect x="410" y="528" width="300" height="172" rx="10" fill="#e6f4f6" stroke="#008192" stroke-width="1.5"/>
  <text x="430" y="558" class="h">Job: migrate</text>
  <text x="430" y="582" class="s">backend/cmd/seed</text>
  <text x="430" y="604" class="s">Runs once per release,</text>
  <text x="430" y="624" class="s">before the new revision</text>
  <text x="430" y="652" class="s">takes traffic — the API</text>
  <text x="430" y="672" class="s">refuses an older database</text>

  <rect x="750" y="528" width="460" height="172" rx="10" fill="#e6f4f6" stroke="#008192" stroke-width="2"/>
  <text x="770" y="558" class="h">Container App: api — the Go API</text>
  <text x="770" y="582" class="s">backend/cmd/api · one binary, stateless · 2–10 replicas (KEDA)</text>
  <text x="770" y="604" class="s">handler → service → store · all business rules here</text>
  <text x="770" y="626" class="s">Liveness /healthz · readiness /startup /readyz</text>
  <text x="770" y="648" class="s">Access: fail-closed route table + team scopes (ADR-0008)</text>
  <text x="770" y="672" class="s">Blue-green by revision; rollback is a revision switch</text>

  <path d="M 980 704 V 782" class="flow"/>
  <text x="992" y="748" class="lbl">private endpoint</text>

  <path d="M 560 704 V 752 H 700 V 782" class="flow"/>
  <text x="556" y="744" class="lbl">goose migrations, forward only</text>

  <path d="M 230 704 V 782" class="flowDim"/>

  <!-- Data -->
  <rect x="60" y="782" width="480" height="112" rx="10" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="812" class="h dim">Blob Storage + SFTP — later</text>
  <text x="80" y="836" class="s dim">/outbound · /inbound · /archive → SAP Cloud Integration → GSAP</text>
  <text x="80" y="858" class="s dim">Files only; the application never calls GSAP directly.</text>
  <text x="80" y="880" class="s dim">Uploaded datasets and exports need no object storage (D-376).</text>

  <rect x="640" y="782" width="570" height="112" rx="10" fill="#e6f4ee" stroke="#008557" stroke-width="2"/>
  <text x="660" y="812" class="h">Azure Database for PostgreSQL 18 — Flexible Server</text>
  <text x="660" y="836" class="s">Zone-redundant HA · private endpoint · TLS · Entra authentication</text>
  <text x="660" y="858" class="s">PgBouncer in front of the pgx pools · PITR backups, geo-redundant</text>
  <text x="660" y="880" class="s">Read replica for dashboards once a measurement asks for one</text>

  <!-- Supporting services -->
  <rect x="60" y="930" width="380" height="86" rx="10" fill="#eef1f3" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="80" y="960" class="h">Key Vault</text>
  <text x="80" y="984" class="s">Read with a user-assigned managed identity;</text>
  <text x="80" y="1004" class="s">no secret in the repository or in an image</text>

  <rect x="470" y="930" width="380" height="86" rx="10" fill="#eef1f3" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="490" y="960" class="h">Azure Container Registry</text>
  <text x="490" y="984" class="s">One image per part, built once in dev and</text>
  <text x="490" y="1004" class="s">promoted unchanged by commit SHA</text>

  <rect x="880" y="930" width="360" height="86" rx="10" fill="#eef1f3" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="900" y="960" class="h">Log Analytics + Dynatrace</text>
  <text x="900" y="984" class="s">slog JSON with a request ID;</text>
  <text x="900" y="1004" class="s">OpenTelemetry over OTLP · SLOs</text>

  <!-- Legend and footer -->
  <path d="M 62 1056 H 112" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <text x="122" y="1061" class="lbl">Dashed = later, outside this phase</text>
  <text x="430" y="1061" class="lbl">One resource group per environment: rg-mapp-dev · rg-mapp-test · rg-mapp-prod — each with its own GitHub environment and OIDC federated identity, no stored Azure secrets.</text>
</svg>
