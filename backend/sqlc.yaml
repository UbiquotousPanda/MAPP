version: "2"
# One entry per module (ADR-0022): every entry reads the whole schema, so types and foreign keys resolve,
# and generates only that module's queries, into a package under its internal/ that no other module can import.
overrides:
  go:
    overrides:
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: date
        go_type: time.Time
      - db_type: date
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: pg_catalog.int4
        go_type: int
      - db_type: pg_catalog.int4
        nullable: true
        go_type:
          type: int
          pointer: true
      - db_type: pg_catalog.int8
        nullable: true
        go_type:
          type: int64
          pointer: true
      - db_type: text
        nullable: true
        go_type:
          type: string
          pointer: true
sql:
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/platform/database/queries
    gen:
      go:
        package: sqlcdb
        out: internal/platform/database/sqlcdb
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/modules/access/internal/queries
    gen:
      go:
        package: sqlcdb
        out: internal/modules/access/internal/sqlcdb
        sql_package: pgx/v5
        emit_empty_slices: true
